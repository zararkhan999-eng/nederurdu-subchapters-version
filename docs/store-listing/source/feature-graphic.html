<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<title>NederUrdu feature graphic</title>
<style>
  @font-face{font-family:'DM Sans';src:url('../../../assets/fonts/dm-sans.ttf') format('truetype');font-weight:100 1000}
  @font-face{font-family:'Noto Naskh Arabic';src:url('../../../assets/fonts/noto-naskh-arabic.ttf') format('truetype');font-weight:400 700}
  html,body{margin:0}
  /* Google Play feature graphic: exactly 1024 x 500. */
  .graphic{position:relative;width:1024px;height:500px;overflow:hidden;background:#2b6bff;color:#fff;font-family:'DM Sans',sans-serif}
  .glow{position:absolute;right:-120px;top:-160px;width:620px;height:620px;border-radius:50%;background:#4a82ff}
  .street{position:absolute;left:0;right:0;bottom:0;height:86px;background:#10298f}
  .street::before{content:"";position:absolute;left:0;right:0;top:40px;border-top:6px dashed #f1d27a;opacity:.55}
  .houses{position:absolute;right:24px;bottom:80px;width:430px}
  .cat{position:absolute;right:170px;bottom:34px}
  .copy{position:absolute;left:72px;top:92px;width:520px}
  .copy h1{margin:0;font-size:84px;font-weight:800;letter-spacing:-1px;line-height:1}
  .copy .ur{margin:22px 0 0;font:700 40px/1.7 'Noto Naskh Arabic',serif;direction:rtl;text-align:left;color:#f1d27a}
  .copy .nl{margin:6px 0 0;font-size:26px;font-weight:600;opacity:.92}
  .chips{display:flex;gap:10px;margin-top:22px}
  .chips span{padding:6px 14px;border-radius:99px;background:#ffffff22;font-size:18px;font-weight:700}
</style>
</head>
<body>
  <div class="graphic" id="capture">
    <div class="glow"></div>
    <div class="houses" id="houses"></div>
    <div class="street"></div>
    <div class="cat" id="cat"></div>
    <div class="copy">
      <h1>NederUrdu</h1>
      <p class="ur">اردو کے ذریعے ڈچ سیکھیں</p>
      <p class="nl">Leer Nederlands, stap voor stap</p>
      <div class="chips"><span>A0 · A1 · A2</span><span>Offline</span><span>Urdu ↔ Nederlands</span></div>
    </div>
  </div>
  <script src="../../../motion.js"></script>
  <script src="../../../pim-parts.js"></script>
  <script src="../../../art/kit.js"></script>
  <script src="../../../art/props.js"></script>
  <script>
    const K = PimArt, P = PimProps, C = K.C;
    const row = [[50, C.brick, "step", 92, 210], [146, C.yellow, "bell", 92, 240], [242, C.teal, "point", 92, 200], [338, C.red, "step", 92, 228]]
      .map(([x, wall, gable, w, h]) => K.g(P.canalHouse({ wall, w, h, gable, door: C.blueDark }), { x, y: 300 - h / 2 })).join("");
    document.getElementById("houses").innerHTML = K.svg(390, 300, row).replace('width="390" height="300"', 'width="430" height="331"');
    document.getElementById("cat").innerHTML = `<svg viewBox="0 0 240 190" width="300" height="238">${NU.pimParts.rider({ mood: "happy" })}</svg>`;
  </script>
</body>
</html>
