<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NederUrdu store icon</title>
<style>html,body{margin:0}#capture{display:block;width:512px;height:512px}#capture svg{display:block;width:512px;height:512px}</style>
</head>
<body>
  <!-- Same mark as the Android launcher icon (art/brand.js). Google Play applies its own
       rounded mask, so this is a full square. -->
  <div id="capture"></div>
  <script src="../../../pim-parts.js"></script>
  <script src="../../../art/kit.js"></script>
  <script src="../../../art/brand.js"></script>
  <script>document.getElementById("capture").innerHTML = PimBrand.icon({ rounded: false, size: 512 });</script>
</body>
</html>
