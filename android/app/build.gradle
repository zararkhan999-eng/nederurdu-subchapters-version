plugins {
    id "com.android.application"
}

def releasePropertiesFile = rootProject.file("android/key.properties")
def releaseProperties = new Properties()
def hasReleaseSigning = releasePropertiesFile.exists()

if (hasReleaseSigning) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { propertyName ->
        if (!releaseProperties.getProperty(propertyName)) {
            throw new GradleException("Missing ${propertyName} in android/key.properties")
        }
    }
}

android {
    namespace "com.nederurdu.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.nederurdu.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseProperties.getProperty("storeFile"))
                storePassword releaseProperties.getProperty("storePassword")
                keyAlias releaseProperties.getProperty("keyAlias")
                keyPassword releaseProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(":app:bundleRelease") && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured. Add the private android/key.properties file before building a Play Store bundle."
        )
    }
}
